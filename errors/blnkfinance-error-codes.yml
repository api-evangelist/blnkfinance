bulk_per_item_codes:
  note: >-
    Bulk commit / void return HTTP 200 with succeeded, failed and results[]. Branch on results[].code,
    NOT on the HTTP status. These per-item codes are not part of the TXN_* catalog.
  codes:
  - {code: NOT_FOUND, meaning: Transaction ID does not exist}
  - {code: ALREADY_COMMITTED, meaning: Inflight transaction was already committed}
  - {code: ALREADY_VOIDED, meaning: Inflight transaction was already voided}
  - {code: NOT_INFLIGHT, meaning: Transaction is not in INFLIGHT status}
  - {code: INVALID_AMOUNT, meaning: Commit amount is invalid}
  - {code: LOCKED, meaning: Concurrent operation on the same transaction, remediation: retry shortly with backoff}
  - {code: INTERNAL_ERROR, meaning: Unexpected server failure for this item}
  - {code: QUEUED, meaning: Item was queued for processing}
  - {code: ALREADY_QUEUED, meaning: A commit or void is already queued for this transaction}
legacy_normalization:
  note: Blnk normalizes older generic names to canonical codes before the response leaves the server.
  map:
    NOT_FOUND: GEN_NOT_FOUND
    CONFLICT: GEN_CONFLICT
    BAD_REQUEST: GEN_BAD_REQUEST
    INVALID_INPUT: GEN_VALIDATION_ERROR
    INTERNAL_SERVER_ERROR: GEN_INTERNAL
    RATE_LIMITED: GEN_RATE_LIMITED
