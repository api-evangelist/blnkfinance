generated: '2026-08-27'
method: searched
source: https://docs.blnkfinance.com/advanced/error-codes
format: proprietary-envelope
note: >-
  Not RFC 9457. Blnk returns application/json with a nested `error_detail` object carrying a stable
  domain-prefixed `code`, a display `message`, and optional structured `details`. Legacy top-level
  `error` / `errors` strings are retained for backwards compatibility and the docs are explicit that
  clients must branch on `error_detail.code` and never parse message text. Structured errors are
  available from Blnk Core 0.15.0 onward. The PUBLISHED OpenAPI documents no 4xx/5xx responses at all
  (18 operations, only 200/201 declared), so this catalog is harvested from the docs, not derived from
  the spec -- that gap is the single largest contract-quality defect on this provider.
envelope:
  content_type: application/json
  fields:
  - field: error_detail.code
    description: Stable code from the catalog. Branch on this.
  - field: error_detail.message
    description: Human-readable. May change between releases. Display only.
  - field: error_detail.details
    description: Optional structured context (filter parse errors, reindex progress, batch ids).
  - field: error / errors
    description: Backwards-compatible display strings. Do not build logic on these.
  example:
    error: transaction not found
    error_detail:
      code: TXN_NOT_FOUND
      message: transaction not found
      details: {}
unclassified_failures:
  status: 500
  message: internal server error
  note: Underlying error is logged server-side and never echoed to clients.
