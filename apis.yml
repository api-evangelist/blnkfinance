description: Open-source double-entry ledger for financial products (wallets, loans, payouts, escrow, cards). Available as
  self-hosted Blnk Core (OSS engine) and Blnk Cloud (managed), plus Blnk Watch for transaction monitoring. Exposes REST APIs
  with a public OpenAPI spec, hosted MCP servers, llms.txt, and installable agent skills.
