      summary: Update Balance Monitor
      operationId: UpdateBalanceMonitor
      parameters:
      - name: id
        in: path
        description: ''
        required: true
        style: simple
        schema:
          type: string
          example: mon_da573822-902c-4349-86c9-2c02ab697c6e
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/UpdateBalanceMonitorRequest'
              - example:
                  balance_id: bln_c1750613-b4b0-4cde-9793-459165a8715f
                  condition:
                    field: balance
                    operator: '='
                    value: 10000000
            example:
              balance_id: bln_c1750613-b4b0-4cde-9793-459165a8715f
              condition:
                field: balance
                operator: '='
                value: 10000000
        required: true
      responses:
        '200':
          description: ''
          headers: {}
      deprecated: false
      tags:
      - Balance Monitors
    get:
      summary: Get Balance Monitor
      operationId: GetBalanceMonitor
      parameters:
      - name: id
        in: path
        description: ''
        required: true
        style: simple
        schema:
          type: string
          example: mon_e0e77b0c-4985-472a-9bf5-76a48b0259b0
      responses:
        '200':
          description: OK
          headers:
            Date:
              content:
