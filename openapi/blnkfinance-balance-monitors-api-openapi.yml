              - example:
                  balance_id: bln_0be360ca-86fe-457d-be43-daa3f966d8f0
                  condition:
                    field: debit_balance
                    operator: '>'
                    value: 100000
                  call_back_url: https://api.myapp.com/balancemonitor
            example:
              balance_id: bln_0be360ca-86fe-457d-be43-daa3f966d8f0
              condition:
                field: debit_balance
                operator: '>'
                value: 100000
              call_back_url: https://api.myapp.com/balancemonitor
        required: true
      responses:
        '201':
          description: Created
          headers:
            Date:
              content:
                text/plain:
                  schema:
                    type: string
                  example: Tue, 20 Feb 2024 05:56:58 GMT
            Content-Length:
              content:
                text/plain:
                  schema:
                    type: string
                  example: '268'
          content:
            application/json; charset=utf-8:
              schema:
                allOf:
                - $ref: '#/components/schemas/CreateBalanceMonitor'
                - example:
                    monitor_id: mon_e0e77b0c-4985-472a-9bf5-76a48b0259b0
                    balance_id: bln_0be360ca-86fe-457d-be43-daa3f966d8f0
                    condition:
                      field: debit_balance
                      operator: '>'
                      value: 100000
                    description: ''
                    call_back_url: https://api.myapp.com/balancemonitor
                    created_at: '2024-02-20T05:56:58.257315054Z'
              example:
                monitor_id: mon_e0e77b0c-4985-472a-9bf5-76a48b0259b0
