          type: string
        condition:
          $ref: '#/components/schemas/Condition'
      example:
        balance_id: bln_c1750613-b4b0-4cde-9793-459165a8715f
        condition:
          field: balance
          operator: '='
          value: 10000000
    Condition:
      title: Condition
      required:
      - field
      - operator
      - value
      type: object
      properties:
        field:
          type: string
        operator:
          type: string
        value:
          type: integer
          format: int32
      example:
        field: debit_balance
        operator: '>'
        value: 100000
    CreateBalanceMonitor:
      title: CreateBalanceMonitor
      required:
      - monitor_id
      - balance_id
      - condition
      - description
      - call_back_url
      - created_at
