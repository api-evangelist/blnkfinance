openapi: 3.2.0
info:
  title: Blnk Transactions API
  contact: {}
  version: '1.0'
servers:
- url: http://localhost:5001
  variables: {}
security: []
tags:
- name: Transactions
paths:
  /transactions:
    post:
      summary: Record Transaction
      operationId: RecordTransaction
      parameters: []
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/RecordTransactionRequest'
              - example:
                  precise_amount: 74000
                  precision: 100
                  reference: reference
                  sources:
                  - identifier: bln_f2073f6b-905a-4e3e-b5a2-8d1b3dc2fb7f
                    distribution: 10%
                    narration: Monthly contribution
                  - identifier: bln_64c50fb5-32d5-4f78-9f4a-e8b01aaf025d
                    precise_distribution: '2000000'
                    narration: Monthly contribution
                  - identifier: bln_7d98dfe9-5c3e-4c9b-b96a-65f6d9f7b89b
                    distribution: left
                    narration: Monthly contribution
                  destinations:
                  - identifier: bln_f2073f6b-905a-4e3e-b5a2-8d1b3dc2fb7f
                    distribution: 20%
                    narration: For groceries
                  - identifier: bln_64c50fb5-32d5-4f78-9f4a-e8b01aaf025d
                    precise_distribution: '1000000'
                    narration: For electricity bills
                  - identifier: bln_7d98dfe9-5c3e-4c9b-b96a-65f6d9f7b89b
                    distribution: left
                    narration: For savings
                  currency: NGN
                  source: '@inflighttest6'
                  destination: '@inflighttest7'
                  allow_over_draft: true
                  inflight: true
            example:
              precise_amount: 74000
              precision: 100
              reference: reference
              sources:
              - identifier: bln_f2073f6b-905a-4e3e-b5a2-8d1b3dc2fb7f
                distribution: 10%
                narration: Monthly contribution
              - identifier: bln_64c50fb5-32d5-4f78-9f4a-e8b01aaf025d
                precise_distribution: '2000000'
                narration: Monthly contribution
              - identifier: bln_7d98dfe9-5c3e-4c9b-b96a-65f6d9f7b89b
                distribution: left
                narration: Monthly contribution
              destinations:
              - identifier: bln_f2073f6b-905a-4e3e-b5a2-8d1b3dc2fb7f
                distribution: 20%
                narration: For groceries
              - identifier: bln_64c50fb5-32d5-4f78-9f4a-e8b01aaf025d
                precise_distribution: '1000000'
                narration: For electricity bills
              - identifier: bln_7d98dfe9-5c3e-4c9b-b96a-65f6d9f7b89b
                distribution: left
                narration: For savings
              currency: NGN
              source: '@inflighttest6'
              destination: '@inflighttest7'
              allow_over_draft: true
              inflight: true
        required: true
      responses:
        '201':
          description: Created
          headers:
            Date:
              content:
                text/plain:
                  schema:
                    type: string
                  example: Sun, 07 Apr 2024 08:17:25 GMT
            Content-Length:
              content:
                text/plain:
                  schema:
                    type: string
                  example: '403'
          content:
            application/json; charset=utf-8:
              schema:
                allOf:
                - $ref: '#/components/schemas/RecordTransaction'
                - example:
                    amount: 74000
                    id: txn_d0440bb5-e2c2-4937-bb4c-e91b50b7df22
                    allow_overdraft: true
                    infligt: true
                    source: '@inflighttest6'
                    destination: '@inflighttest7'
                    reference: reference
                    currency: NGN
                    description: ''
                    status: INFLIGHT
                    hash: 89ba8954cd8e9215feed757be7cebe0a3ec9440be22139a5ba6a0499a52f4593
                    group_ids: null
                    created_at: '0001-01-01T00:00:00Z'
                    scheduled_for: '0001-01-01T00:00:00Z'
                    inflight_expiry_date: '0001-01-01T00:00:00Z'
                    inflight_commit_date: '0001-01-01T00:00:00Z'
              example:
                amount: 74000
                id: txn_d0440bb5-e2c2-4937-bb4c-e91b50b7df22
                allow_overdraft: true
                infligt: true
                source: '@inflighttest6'
                destination: '@inflighttest7'
                reference: reference
                currency: NGN
                description: ''
                status: INFLIGHT
                hash: 89ba8954cd8e9215feed757be7cebe0a3ec9440be22139a5ba6a0499a52f4593
                group_ids: null
                created_at: '0001-01-01T00:00:00Z'
                scheduled_for: '0001-01-01T00:00:00Z'
                inflight_expiry_date: '0001-01-01T00:00:00Z'
                inflight_commit_date: '0001-01-01T00:00:00Z'
      deprecated: false
      tags:
      - Transactions
  /transactions/inflight/{txID}:
    put:
      summary: Update Inflight Transaction
      operationId: UpdateInflightTransaction
      parameters:
      - name: txID
        in: path
        description: ''
        required: true
        style: simple
        schema:
          type: string
          example: txn_d0440bb5-e2c2-4937-bb4c-e91b50b7df22
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/UpdateInflightTransactionRequest'
              - example:
                  status: void
            example:
              status: void
        required: true
      responses:
        '200':
          description: OK
          headers:
            Date:
              content:
                text/plain:
                  schema:
                    type: string
                  example: Sun, 07 Apr 2024 08:20:06 GMT
            Content-Length:
              content:
                text/plain:
                  schema:
                    type: string
                  example: '402'
          content:
            application/json; charset=utf-8:
              schema:
                allOf:
                - $ref: '#/components/schemas/UpdateInflightTransaction'
                - example:
                    amount: 74000
                    precision: 0
                    transaction_id: txn_bd9ab37f-e353-450d-8210-1958bd50254a
                    parent_transaction: txn_5cc1e86b-47be-4aba-a400-48e7b9edfedd
                    allow_overdraft: false
                    infligt: false
                    source: bln_8ab15e8f-da33-428f-b3f8-ab3d1c1dda09
                    destination: bln_76ceff93-fcac-47e0-84ee-88e086359064
                    reference: reference
                    currency: NGN
                    description: ''
                    status: VOID
                    hash: 032af5e26c8a2c2690f1bb70bdd7c044bbdf9c7f5576fc0f693200baf65a9ee3
                    created_at: '2024-04-07T08:20:06.494307542Z'
                    scheduled_for: '0001-01-01T00:00:00Z'
                    inflight_expiry_date: '0001-01-01T00:00:00Z'
                    inflight_commit_date: '0001-01-01T00:00:00Z'
              example:
                amount: 74000
                precision: 0
                transaction_id: txn_bd9ab37f-e353-450d-8210-1958bd50254a
                parent_transaction: txn_5cc1e86b-47be-4aba-a400-48e7b9edfedd
                allow_overdraft: false
                infligt: false
                source: bln_8ab15e8f-da33-428f-b3f8-ab3d1c1dda09
                destination: bln_76ceff93-fcac-47e0-84ee-88e086359064
                reference: reference
                currency: NGN
                description: ''
                status: VOID
                hash: 032af5e26c8a2c2690f1bb70bdd7c044bbdf9c7f5576fc0f693200baf65a9ee3
                created_at: '2024-04-07T08:20:06.494307542Z'
                scheduled_for: '0001-01-01T00:00:00Z'
                inflight_expiry_date: '0001-01-01T00:00:00Z'
                inflight_commit_date: '0001-01-01T00:00:00Z'
      deprecated: false
      tags:
      - Transactions
components:
  schemas:
    RecordTransactionRequest:
      title: RecordTransactionRequest
      required:
      - amount
      - reference
      - sources
      - destinations
      - currency
      - source
      - destination
      - allow_over_draft
      - inflight
      type: object
      properties:
        amount:
          type: integer
          format: int32
        reference:
          type: string
        sources:
          type: array
          items:
            $ref: '#/components/schemas/Source'
          description: ''
        destinations:
          type: array
          items:
            $ref: '#/components/schemas/Destination'
          description: ''
        currency:
          type: string
        source:
          type: string
        destination:
          type: string
        allow_over_draft:
          type: boolean
        inflight:
          type: boolean
        inflight_expiry_date:
          type: string
          description: RFC3339 datetime with offset (e.g. 2024-04-22T15:28:03+00:00). When inflight is true, the transaction is voided after this time.
        inflight_commit_date:
          type: string
          description: RFC3339 datetime with offset. When inflight is true, Blnk automatically commits at this time. See /transactions/inflight/updating-inflight docs.
      example:
        precise_amount: 74000
        precision: 100
        reference: reference
        sources:
        - identifier: bln_f2073f6b-905a-4e3e-b5a2-8d1b3dc2fb7f
          distribution: 10%
          narration: Monthly contribution
        - identifier: bln_64c50fb5-32d5-4f78-9f4a-e8b01aaf025d
          precise_distribution: '2000000'
          narration: Monthly contribution
        - identifier: bln_7d98dfe9-5c3e-4c9b-b96a-65f6d9f7b89b
          distribution: left
          narration: Monthly contribution
        destinations:
        - identifier: bln_f2073f6b-905a-4e3e-b5a2-8d1b3dc2fb7f
          distribution: 20%
          narration: For groceries
        - identifier: bln_64c50fb5-32d5-4f78-9f4a-e8b01aaf025d
          precise_distribution: '1000000'
          narration: For electricity bills
        - identifier: bln_7d98dfe9-5c3e-4c9b-b96a-65f6d9f7b89b
          distribution: left
          narration: For savings
        currency: NGN
        source: '@inflighttest6'
        destination: '@inflighttest7'
        allow_over_draft: true
        inflight: true
    Source:
      title: Source
      required:
      - identifier
      - distribution
      - narration
      type: object
      properties:
        identifier:
          type: string
        distribution:
          type: string
        narration:
          type: string
      example:
        identifier: bln_f2073f6b-905a-4e3e-b5a2-8d1b3dc2fb7f
        distribution: 10%
        narration: Monthly contribution
    RecordTransaction:
      title: RecordTransaction
      required:
      - amount
      - id
      - allow_overdraft
      - infligt
      - source
      - destination
      - reference
      - currency
      - description
      - status
      - hash
      - group_ids
      - created_at
      - scheduled_for
      type: object
      properties:
        amount:
          type: integer
          format: int32
        id:
          type: string
        allow_overdraft:
          type: boolean
        infligt:
          type: boolean
        source:
          type: string
        destination:
          type: string
        reference:
          type: string
        currency:
          type: string
        description:
          type: string
        status:
          type: string
        hash:
          type: string
        group_ids:
          type:
          - string
          - 'null'
        created_at:
          type: string
        scheduled_for:
          type: string
        inflight_expiry_date:
          type: string
          description: RFC3339 datetime with offset when unset shown as zero time.
        inflight_commit_date:
          type: string
          description: RFC3339 datetime with offset when unset shown as zero time; automatic commit when inflight.
      example:
        amount: 74000
        id: txn_d0440bb5-e2c2-4937-bb4c-e91b50b7df22
        allow_overdraft: true
        infligt: true
        source: '@inflighttest6'
        destination: '@inflighttest7'
        reference: reference
        currency: NGN
        description: ''
        status: INFLIGHT
        hash: 89ba8954cd8e9215feed757be7cebe0a3ec9440be22139a5ba6a0499a52f4593
        group_ids: null
        created_at: '0001-01-01T00:00:00Z'
        scheduled_for: '0001-01-01T00:00:00Z'
        inflight_expiry_date: '0001-01-01T00:00:00Z'
        inflight_commit_date: '0001-01-01T00:00:00Z'
    UpdateInflightTransactionRequest:
      title: UpdateInflightTransactionRequest
      required:
      - status
      type: object
      properties:
        status:
          type: string
      example:
        status: void
    Destination:
      title: Destination
      required:
      - identifier
      - distribution
      - narration
      type: object
      properties:
        identifier:
          type: string
        distribution:
          type: string
        narration:
          type: string
      example:
        identifier: bln_f2073f6b-905a-4e3e-b5a2-8d1b3dc2fb7f
        distribution: 20%
        narration: For groceries
    UpdateInflightTransaction:
      title: UpdateInflightTransaction
      required:
      - amount
      - precision
      - transaction_id
      - parent_transaction
      - allow_overdraft
      - infligt
      - source
      - destination
      - reference
      - currency
      - description
      - status
      - hash
      - created_at
      - scheduled_for
      type: object
      properties:
        amount:
          type: integer
          format: int32
        precision:
          type: integer
          format: int32
        transaction_id:
          type: string
        parent_transaction:
          type: string
        allow_overdraft:
          type: boolean
        infligt:
          type: boolean
        source:
          type: string
        destination:
          type: string
        reference:
          type: string
        currency:
          type: string
        description:
          type: string
        status:
          type: string
        hash:
          type: string
        created_at:
          type: string
        scheduled_for:
          type: string
        inflight_expiry_date:
          type: string
        inflight_commit_date:
          type: string
      example:
        amount: 74000
        precision: 0
        transaction_id: txn_bd9ab37f-e353-450d-8210-1958bd50254a
        parent_transaction: txn_bd9ab37f-e353-450d-8210-1958bd50254a
        allow_overdraft: false
        infligt: false
        source: bln_8ab15e8f-da33-428f-b3f8-ab3d1c1dda09
        destination: bln_76ceff93-fcac-47e0-84ee-88e086359064
        reference: reference
        currency: NGN
        description: ''
        status: APPLIED
        hash: 032af5e26c8a2c2690f1bb70bdd7c044bbdf9c7f5576fc0f693200baf65a9ee3
        created_at: '2024-04-07T08:20:06.494307542Z'
        scheduled_for: '0001-01-01T00:00:00Z'
        inflight_expiry_date: '0001-01-01T00:00:00Z'
        inflight_commit_date: '0001-01-01T00:00:00Z'
  securitySchemes:
    basic:
      type: http
      scheme: basic
