note: >-
  Blnk prices the MANAGED product, not the API. Blnk Core, the ledger REST API itself, is open source and
  free forever -- there is no per-call price and no quota, because the operator runs the binary. The
  paid tiers buy hosting, a back-office, an SLA and (materially for agent buyers) the MCP surface, which
  the comparison table marks "Not included" on the free tier. Metering is per RECORD stored, not per API
  call, plus a throughput ceiling expressed in TPM.
