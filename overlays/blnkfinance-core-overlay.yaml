    x-required-scope: 'accounts:write'
- target: $.paths['/backup'].post
  update:
    tags: [Admin]
    security:
    - blnkKey: []
    x-required-scope: 'backup:write'
- target: $.paths['/backup/s3'].post
  update:
    tags: [Admin]
    security:
    - blnkKey: []
    x-required-scope: 'backup:write'
- target: $.components.schemas
  update:
    BlnkError:
      type: object
      description: >-
        Blnk's error envelope (Core 0.15.0+). Branch on error_detail.code, never on message text. Full
        catalog of 72 codes in errors/blnkfinance-error-codes.yml.
      properties:
        error:
          type: string
          description: Display text, retained for backwards compatibility.
        error_detail:
          type: object
          properties:
            code:
              type: string
              description: Stable, domain-prefixed error code (GEN_, AUTH_, TXN_, BAL_, LGR_, IDT_, RECON_, META_, HOOK_, QUEUE_, SRCH_, ADMIN_, APIKEY_).
              example: TXN_DUPLICATE_REFERENCE
            message:
              type: string
              description: Human-readable. May change between releases.
            details:
              type: object
              description: Optional structured context.
