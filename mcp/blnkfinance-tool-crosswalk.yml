note: >-
  Mapped by name and documented semantics. The live MCP schema is auth-gated (Bearer + mcp:read/mcp:write
  against a per-tenant instance_id), so no tool inputSchema was observed on the wire and no binding here
  is confidence high on parameter shape -- only on which operation backs which tool. The published
  OpenAPI is a partial projection of Blnk Core: it carries 18 of the operations the docs describe and
  omits every list/filter endpoint, GET transaction, bulk transactions, and the DELETE endpoints added in
  0.15.0. That gap, not an MCP-only feature set, is why most read tools land in mcp_only[].
